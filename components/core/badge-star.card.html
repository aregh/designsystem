<style>body{margin:0;padding:24px;background:#FEF2AE;font-family:'Work Sans',sans-serif}.grid{display:flex;flex-wrap:wrap;gap:22px;align-items:flex-start}h4{font-size:11px;text-transform:uppercase;letter-spacing:.08em;opacity:.6;margin:0 0 8px;width:100%}</style>
</head><body><div id="root"></div>

const Bad=DS('CircleBadge'), S=DS('StarRating');
ReactDOM.createRoot(document.getElementById('root')).render(
  <div className="grid" style={{alignItems:'center'}}>
    <Bad size={150}>OSLO 19.–20. juni</Bad>
    <Bad size={170}>Bli sertifisert fasilitator</Bad>
    <div><S/><div style={{height:8}}/><S count={4}/></div>
  </div>);
</script></body></html>
