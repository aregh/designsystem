<!DOCTYPE html><html><head>
<link rel="stylesheet" href="../../styles.css">
<script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
<script type="text/babel" src="../../_ds_bundle.js"></script>
<style>body{margin:0;padding:24px;background:#FEF2AE;font-family:'Work Sans',sans-serif}.grid{display:flex;flex-wrap:wrap;gap:22px;align-items:flex-start}h4{font-size:11px;text-transform:uppercase;letter-spacing:.08em;opacity:.6;margin:0 0 8px;width:100%}</style>
</head><body><div id="root"></div>
<script type="text/babel">
function DS(name){for(const k of Object.keys(window)){const v=window[k];if(v&&typeof v==='object'&&v[name])return v[name];}throw new Error('not found: '+name);}
const Q=DS('Quote');
ReactDOM.createRoot(document.getElementById('root')).render(
  <div className="grid" style={{gap:48}}>
    <Q variant="stor" name="Jim Kalbach" role="author of The Jobs To Be Done Playbook">This should be required reading for everyone who works with design.</Q>
    <Q variant="sidestilt" name="Kari Hamnes" role="Senior UX-designer i NAV">Are har ei unik evne til å finne fram til innovative og tilsynelatande enkle løysningar på komplekse problem.</Q>
  </div>);
</script></body></html>
