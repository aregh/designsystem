<!DOCTYPE html><html lang="nn"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<link rel="stylesheet" href="rapport.css">
<style>
  html,body{margin:0}
  .metode{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--rom-7);margin-top:var(--rom-4)}
  .metode > div{border-top:1px solid var(--strek);padding-top:var(--rom-5)}
  .tal{display:block;font-size:96px;font-weight:var(--vekt-ekstrafeit);line-height:1}
  .kva{display:block;margin-top:var(--rom-3);font-size:var(--slide-tekst);font-weight:var(--vekt-ekstrafeit);line-height:1.25}
  .korleis{display:block;margin-top:var(--rom-2);font-size:var(--slide-tekst-under);line-height:1.4}
</style></head><body>
<!-- Metode: to til fire metodar, kvar med eit tal, kva det er og korleis det vart gjort.
     Ingen kjernemodell-fargar her: tala er ikkje mål, oppgåver eller kjerneinnhald. -->
<div class="slide">
  <p class="etikett">Metode</p>
  <h2 class="tittel">Slik fann vi det ut</h2>
  <div class="metode">
    <div><span class="tal">14</span><span class="kva">djupintervju</span><span class="korleis">60 minutt, digitalt og på staden</span></div>
    <div><span class="tal">312</span><span class="kva">svar i undersøkinga</span><span class="korleis">Open i fire veker, mai og juni</span></div>
    <div><span class="tal">3</span><span class="kva">kjerneverkstader</span><span class="korleis">Med fagfolk og brukarar saman</span></div>
  </div>
  <div class="botn"><span>Brukarinnsikt 2026</span><span>kjernekaren.no</span></div>
</div>
</body></html>
