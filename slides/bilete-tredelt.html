<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<script src="../image-slot.js"></script>
<style>
  html,body{margin:0}
  .slide{width:1280px;height:720px;background:#FEF2AE;font-family:'Work Sans',sans-serif;color:#000;box-sizing:border-box;position:relative;overflow:hidden}
  .brandbar{position:absolute;bottom:28px;left:64px;font-size:15px;font-weight:600}
  .brandbar-r{position:absolute;bottom:28px;right:64px;font-size:15px;font-weight:600}
</style></head><body>
<div class="slide" style="padding:80px 90px">
  <div style="font-size:52px;font-weight:800;margin-bottom:40px">Kjerneverksted i praksis</div>
  <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:32px">
    <div style="display:flex;flex-direction:column;gap:14px">
      <div style="height:300px"><image-slot id="slide-tre-1" shape="rect" fit="cover" placeholder="Foto 1"></image-slot></div>
      <div style="font-size:22px;font-weight:400;line-height:1.4">Prioritere &mdash; kva er viktigast n&aring;?</div>
    </div>
    <div style="display:flex;flex-direction:column;gap:14px">
      <div style="height:300px"><image-slot id="slide-tre-2" shape="rect" fit="cover" placeholder="Foto 2"></image-slot></div>
      <div style="font-size:22px;font-weight:400;line-height:1.4">Samarbeide &mdash; p&aring; tvers av siloar</div>
    </div>
    <div style="display:flex;flex-direction:column;gap:14px">
      <div style="height:300px"><image-slot id="slide-tre-3" shape="rect" fit="cover" placeholder="Foto 3"></image-slot></div>
      <div style="font-size:22px;font-weight:400;line-height:1.4">Fikse &mdash; og m&aring;le effekten</div>
    </div>
  </div>
  <div class="brandbar-r">kjernemodellen.no</div>
</div>
</body></html>
